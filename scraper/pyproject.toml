[project]
name = "aktionen"
version = "0.1.0"
description = "Supermarkt-Aktionen einlesen und für Fitness auswerten"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",  # Zeitzonen für zoneinfo unter Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aktionen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
