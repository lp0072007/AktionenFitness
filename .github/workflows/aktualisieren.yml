# Aktionen jeden Morgen sparsam aktualisieren und (optional) die Website auf GitHub Pages veröffentlichen.
# Einrichtung: docs/ONLINE_STELLEN.md
#
# Hauptauslöser: cron-job.org ruft täglich um 05:30 (Wien) die GitHub-API auf (workflow_dispatch), siehe
# docs/ONLINE_STELLEN.md. Der eigene Zeitplan unten ist nur die Reserve – GitHub startet geplante Läufe oft
# Stunden zu spät oder gar nicht. Doppelte Läufe schaden nicht (sparsam, concurrency verhindert Überschneidung).
# Sparsam: Lidl, Hofer, Penny, Billa, MPreis werden jedes Mal geholt (je wenige Sekunden). Dazu die Normalpreise
# ganzer Shops (Billa, MPreis, ca. 4 Minuten). Spar nur mit Variable
# SPAR = "ja" (Erlaubnis von Spar nötig, siehe docs/DATENQUELLEN.md) und dann nur bei neuem Flugblatt. dm wird nicht geladen (robots.txt der dm-Produktsuche: "Disallow: /").
# Fällt ein Geschäft aus oder liefert 0 Angebote, bleibt sein letzter Stand stehen und der Lauf zeigt eine Warnung.
# Letzter Stand und Preisverlauf liegen im Branch "daten".
#
# Veröffentlichen (GitHub Pages) erst, wenn die Repository-Variable VEROEFFENTLICHEN = "ja" gesetzt ist
# (Settings -> Secrets and variables -> Actions -> Variables) und Pages auf "GitHub Actions" steht.
name: Aktionen aktualisieren

on:
  schedule:
    - cron: "17 10 * * *"  # Reserve: täglich 10:17 UTC (= 11:17 / 12:17 in Österreich)
  workflow_dispatch:
    inputs:
      alles:
        description: "Alles neu laden (auch unveränderte Spar-Flugblätter)"
        type: boolean
        default: false

permissions:
  contents: write   # letzten Stand und Preisverlauf in den Branch "daten" schreiben
  pages: write
  id-token: write

concurrency:
  group: aktualisieren
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Abhängigkeiten
        run: pip install -e "scraper[pdf,dev]"

      - name: Tests
        run: |
          cd scraper && python -m pytest -q
          cd ../web && node --test

      - name: Letzten Stand holen (Branch "daten")
        run: |
          mkdir -p data/letzter_stand
          if git fetch --depth=1 origin daten; then
            git show FETCH_HEAD:preisverlauf.db > data/preisverlauf.db || rm -f data/preisverlauf.db
            # Nährwerte-Zwischenspeicher: jedes Produkt nur einmal bei Billa/Lidl/Open Food Facts nachschlagen
            git show FETCH_HEAD:naehrwerte.json > data/naehrwerte.json || rm -f data/naehrwerte.json
            for f in angebote.json aktionen.js sortiment.js; do
              git show "FETCH_HEAD:stand/$f" > "data/letzter_stand/$f" || rm -f "data/letzter_stand/$f"
            done
          fi
          ls -la data data/letzter_stand

      - name: Export
        env:
          # Flugblatt-Ausschnitte von Spar nur veröffentlichen, wenn die Bildrechte geklärt sind:
          # Repository-Variable FLUGBLATT_BILDER = "ja" setzen (Settings -> Secrets and variables -> Actions -> Variables)
          FLUGBLATT_BILDER: ${{ vars.FLUGBLATT_BILDER }}
          # Spar erst mit Erlaubnis: robots.txt schließt den PDF-Abruf (GetPDF.ashx) aus. Variable SPAR = "ja" schaltet ein.
          SPAR: ${{ vars.SPAR }}
          ALLES: ${{ inputs.alles }}
        run: |
          cd scraper
          OPT=""
          if [ "$FLUGBLATT_BILDER" != "ja" ]; then OPT="--ohne-bilder"; fi
          if [ "$SPAR" != "ja" ]; then OPT="$OPT --ohne-spar"; fi
          if [ "$ALLES" != "true" ]; then OPT="$OPT --alt ../data/letzter_stand"; fi
          python -m aktionen.export $OPT

      # Normalpreise ganzer Online-Shops (Billa, MPreis; Spar erst mit SPAR = "ja") für den Einkaufslisten-Vergleich.
      # Fällt ein Shop aus, bleibt sein letzter Stand. Ein Fehler hier hält die Aktionen nicht auf.
      - name: Sortiment (Normalpreise)
        continue-on-error: true
        env:
          SPAR: ${{ vars.SPAR }}
        run: |
          cd scraper
          OPT=""
          if [ "$SPAR" != "ja" ]; then OPT="--ohne-spar"; fi
          if [ -f ../data/letzter_stand/sortiment.js ]; then OPT="$OPT --alt ../data/letzter_stand/sortiment.js"; fi
          python -m aktionen.sortiment $OPT

      - name: Letzten Stand und Preisverlauf sichern (Branch "daten")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In einem eigenen Ordner, damit der Website-Ordner unberührt bleibt
          mkdir -p /tmp/daten/stand
          cp data/preisverlauf.db /tmp/daten/
          if [ -f data/naehrwerte.json ]; then cp data/naehrwerte.json /tmp/daten/; fi
          cp web/data/angebote.json web/data/aktionen.js /tmp/daten/stand/
          if [ -f web/data/sortiment.js ]; then cp web/data/sortiment.js /tmp/daten/stand/; fi
          cd /tmp/daten
          git init -q && git checkout -q -b daten
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Stand $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" daten

      - uses: actions/upload-pages-artifact@v3
        if: vars.VEROEFFENTLICHEN == 'ja'
        with:
          path: web

  veroeffentlichen:
    needs: export
    if: vars.VEROEFFENTLICHEN == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
